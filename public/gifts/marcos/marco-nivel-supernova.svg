<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff2a85" stop-opacity="1"/>
        <stop offset="50%" stop-color="#ffcf33" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#b829ff" stop-opacity="1"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="14" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <rect x="24" y="24" width="464" height="464" rx="64" fill="rgba(52, 10, 42, 0.42)" stroke="url(#frameGrad)" stroke-width="8" filter="url(#glow)"/>
    <rect x="38" y="38" width="436" height="436" rx="52" fill="none" stroke="#ffcf33" stroke-opacity="0.5" stroke-width="2.5"/>
  </svg>